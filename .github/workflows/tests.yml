name: Tests

on:
  push:

jobs:
  tests:
    name: test ${{matrix.db}} ruby-${{ matrix.ruby }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Security-fixed css_parser requires Ruby >= 3.3; Gemfile enforces this floor.
        ruby: ['3.3', '3.4']
        db: ['postgresql', 'mysql2', 'sqlite3']
      fail-fast: false

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: redmine_test
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: redmine_test
          MYSQL_ROOT_PASSWORD: 'root'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Redmine test environment
        uses: ./.github/actions/setup-redmine
        with:
          db-type: ${{ matrix.db }}
          ruby-version: ${{ matrix.ruby }}

      - name: Verify the selected database and preserve the frozen lock
        shell: python
        env:
          REDMINE_CI_DATABASE: ${{ matrix.db }}
        run: |
          import hashlib
          import os
          from pathlib import Path
          import secrets
          import subprocess

          before = Path("Gemfile.lock").read_bytes()
          test_secret = secrets.token_hex(64)
          probe = """
          require 'json'
          require_relative 'config/environment'
          expected = ENV.fetch('REDMINE_CI_DATABASE')
          drivers = {'sqlite3' => 'sqlite3', 'postgresql' => 'pg', 'mysql2' => 'mysql2'}
          abort 'DATABASE_EXPECTATION_INVALID' unless drivers.key?(expected)
          config = ActiveRecord::Base.connection_db_config
          abort 'DATABASE_ENVIRONMENT_MISMATCH' unless Rails.env.test? && config.env_name == 'test'
          abort 'DATABASE_ADAPTER_MISMATCH' unless config.adapter == expected
          connection = ActiveRecord::Base.connection
          if expected == 'sqlite3'
            databases = connection.select_all('PRAGMA database_list').to_a
            actual = databases.find {|database| database.fetch('name') == 'main'}.fetch('file')
            intended = Rails.root.join('db/test.sqlite3')
            abort 'DATABASE_IDENTITY_MISMATCH' unless File.realpath(actual) == File.realpath(intended)
          else
            sql = expected == 'postgresql' ? 'SELECT current_database()' : 'SELECT DATABASE()'
            actual = connection.select_value(sql)
            abort 'DATABASE_IDENTITY_MISMATCH' unless actual == 'redmine_test'
          end
          2.times { abort 'DATABASE_QUERY_FAILED' unless connection.select_value('SELECT 1').to_s == '1' }
          puts 'ROOT_DATABASE_CONNECTION_JSON=' + JSON.generate(
            status: 'passed', sha: ENV.fetch('GITHUB_SHA'), ruby: RUBY_VERSION,
            adapter: expected, database: actual,
            driver_version: Gem.loaded_specs.fetch(drivers.fetch(expected)).version.to_s,
            query: 'SELECT 1', replay: true
          )
          """
          result = subprocess.run(
              ["bundle", "exec", "ruby", "-e", probe],
              text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=45,
              env=dict(os.environ, RAILS_ENV="test", SECRET_KEY_BASE=test_secret, BUNDLE_FROZEN="true"),
          )
          print(result.stdout.replace(test_secret, "[REDACTED]"), flush=True)
          if result.returncode:
              raise SystemExit(result.returncode)
          if Path("Gemfile.lock").read_bytes() != before:
              raise SystemExit("DATABASE_PROBE_CHANGED_LOCK")
          print("ROOT_DATABASE_CONNECTION_LOCK_SHA256=" + hashlib.sha256(before).hexdigest(), flush=True)

      - name: Verify real Git diff regressions before the full suite
        shell: python
        run: |
          import os
          import runpy
          import secrets
          import subprocess

          require_suite = runpy.run_path("render_runtime/root_bundle_check.py")["require_suite"]

          revision = subprocess.check_output(
              ["git", "--git-dir", "tmp/test/git_repository", "rev-parse", "--verify",
               "713f4944648826f558cf548222f813dabe7cbb04^{commit}"],
              text=True, timeout=10,
          ).strip()
          if revision != "713f4944648826f558cf548222f813dabe7cbb04":
              raise SystemExit("GIT_DIFF_FIXTURE_MISSING")
          for path in (
              "lib/redmine/scm/adapters/git_adapter.rb",
              "test/unit/lib/redmine/scm/adapters/git_adapter_test.rb",
          ):
              subprocess.run(["ruby", "-c", path], check=True, timeout=10)
          test_secret = secrets.token_hex(64)
          result = subprocess.run(
              ["bin/rails", "test",
               "test/unit/lib/redmine/scm/adapters/git_adapter_test.rb", "--name", "/test_diff_/"],
              text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=90,
              env=dict(os.environ, RAILS_ENV="test", SECRET_KEY_BASE=test_secret),
          )
          output = result.stdout.replace(test_secret, "[REDACTED]")
          print(output, flush=True)
          if result.returncode:
              raise SystemExit(result.returncode)
          print(require_suite(output), flush=True)

      - name: Run tests
        run: |
          bin/rails test

      - name: Run bazaar non ascii test
        env:
          LANG: en_US.ISO8859-1
          LC_ALL: en_US.ISO8859-1
        shell: python
        run: |
          import os
          import secrets
          import subprocess

          test_secret = secrets.token_hex(64)
          result = subprocess.run(
              ["bin/rails", "test", "test/unit/repository_bazaar_test.rb"],
              text=True, encoding="utf-8", errors="replace",
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=120,
              env=dict(os.environ, RAILS_ENV="test", SECRET_KEY_BASE=test_secret),
          )
          print(result.stdout.replace(test_secret, "[REDACTED]"), flush=True)
          raise SystemExit(result.returncode)

      - name: Run autoload test
        shell: python
        run: |
          import os
          import re
          import secrets
          import subprocess

          test_secret = secrets.token_hex(64)
          result = subprocess.run(
              ["bin/rails", "test:autoload"],
              text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=120,
              env=dict(os.environ, RAILS_ENV="test", SECRET_KEY_BASE=test_secret, BUNDLE_FROZEN="true"),
          )
          output = result.stdout.replace(test_secret, "[REDACTED]")
          print(output, flush=True)
          if result.returncode:
              raise SystemExit(result.returncode)
          summaries = re.findall(
              r"(?m)^\s*(\d+) runs, (\d+) assertions, (\d+) failures, (\d+) errors, (\d+) skips\s*$",
              output,
          )
          if len(summaries) != 1:
              raise SystemExit("AUTOLOAD_SUITE_SUMMARY_INVALID")
          runs, assertions, failures, errors, skips = map(int, summaries[0])
          if runs < 1 or assertions < 1 or failures or errors or skips:
              raise SystemExit("AUTOLOAD_SUITE_NOT_PASSED")

  system-tests:
    name: system test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Redmine test environment
        uses: ./.github/actions/setup-redmine
        with:
          db-type: sqlite3
          ruby-version: '3.4'

      # System tests use Chrome and ChromeDriver installed on the GitHub Actions Ubuntu image.
      # They are generally updated to the latest stable versions.
      - name: Display Chrome version
        run: google-chrome --version

      - name: Run system tests
        run: bin/rails test:system
        env:
          GOOGLE_CHROME_OPTS_ARGS: headless,disable-gpu,no-sandbox,disable-dev-shm-usage

      - name: Upload system test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-screenshots
          path: tmp/screenshots
          if-no-files-found: ignore
