services:
  - type: web
    name: redmine
    runtime: ruby
    region: oregon
    plan: free
    buildCommand: >
      bundle config set --local without 'development test' &&
      bundle install &&
      bundle exec rails assets:precompile RAILS_ENV=production &&
      bundle exec rails db:migrate RAILS_ENV=production
    startCommand: bundle exec puma -b tcp://0.0.0.0:$PORT -e production
    healthCheckPath: /
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: redmine-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true

databases:
  - name: redmine-db
    databaseName: redmine_production
    user: redmine_user
    plan: free
