name: Keep Render Redmine Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping Redmine
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Request Redmine homepage
        run: |
          curl --fail --location --silent --show-error \
            --max-time 90 \
            --retry 2 \
            --retry-delay 10 \
            --user-agent "github-actions-render-keepalive" \
            "https://redmine-c5i6.onrender.com/"
