name: Lint

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Validate request spec syntax and parser negative control
        shell: bash
        run: |
          set -euo pipefail
          ruby -c spec/requests/projects_spec.rb
          ruby -c spec/services/issue_import_spec.rb
          ruby -rripper -e 'abort "RUBY_NEGATIVE_CONTROL_FAILED" unless Ripper.sexp("describe :outer do\n describe :first do\n end  describe :second do\n end\nend\n").nil?'

      - name: Lint code for consistent style
        run: bundle exec rubocop --parallel

  stylelint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: yarn install

      - name: Lint CSS and SCSS files
        run: npx stylelint "app/assets/stylesheets/**/*.css"

  bundle-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run bundle-audit
        run: bundle exec bundle audit check --update

  runtime-safety:
    name: Redmine DEV runtime safety
    if: github.ref == 'refs/heads/dev/reqsys-e2e-redmine-6.1.4-20260928'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact commit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            render_runtime
            .github/workflows
      - name: Validate syntax and execute local safety regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 --version
          bash -n render_runtime/build_redmine_6_1_4.sh
          ruby -c render_runtime/bootstrap.rb
          python3 -m py_compile render_runtime/runtime_safety.py render_runtime/tests/test_runtime_safety.py
          python3 -m unittest discover -s render_runtime/tests -p 'test_*.py' -v
          printf 'REDMINE_RUNTIME_SAFETY_TESTED sha=%s scope=local-contracts-not-render-e2e\n' "${GITHUB_SHA}"

  runtime-full-build:
    name: Redmine DEV full isolated build
    needs: runtime-safety
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev/reqsys-e2e-redmine-6.1.4-20260928'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: redmine-full-isolated-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout exact source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: render_runtime
      - name: Set up supported Ruby without historical bundle cache
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        with:
          ruby-version: '3.3'
          bundler: '2.6.7'
          bundler-cache: false
      - name: Provision and verify real thumbnail dependency on disposable hosted runner
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT}" = "github-hosted"
          test "${GITHUB_REPOSITORY}" = "ericson-j-santos/redmine"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          timeout --kill-after=10s 120s sudo -n apt-get -o Acquire::Retries=1 update
          timeout --kill-after=10s 120s sudo -n apt-get -y --no-install-recommends install imagemagick
          timeout 10s convert -version
          probe="$(mktemp -d "${RUNNER_TEMP}/redmine-thumbnail.XXXXXX")"
          timeout 10s convert -size 8x8 xc:white "${probe}/input.png"
          timeout 10s convert "${probe}/input.png" -resize 4x4 "${probe}/output.jpg"
          timeout 10s convert "${probe}/input.png" -resize 4x4 "${probe}/output.webp"
          test "$(timeout 10s identify -format '%m:%wx%h' "${probe}/output.jpg")" = 'JPEG:4x4'
          test "$(timeout 10s identify -format '%m:%wx%h' "${probe}/output.webp")" = 'WEBP:4x4'
          printf 'REAL_THUMBNAIL_DEPENDENCY_VERIFIED sha=%s jpeg=4x4 webp=4x4\n' "${GITHUB_SHA}"
      - name: Execute real release build in a fresh disposable directory
        id: build
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import runpy
          import secrets
          import shutil
          import signal
          import sqlite3
          import subprocess
          import tempfile

          sha = os.environ["GITHUB_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("CI_SHA_INVALID")
          if os.environ.get("GITHUB_REPOSITORY") != "ericson-j-santos/redmine":
              raise SystemExit("CI_REPOSITORY_INVALID")
          if os.environ.get("RUNNER_ENVIRONMENT") != "github-hosted":
              raise SystemExit("CI_HOSTED_RUNNER_REQUIRED")
          observed = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if observed != sha:
              raise SystemExit("CI_CHECKOUT_SHA_MISMATCH")

          root = Path(tempfile.mkdtemp(prefix="redmine-real-", dir=os.environ["RUNNER_TEMP"]))
          shutil.copytree(Path("render_runtime"), root / "render_runtime")
          home = root / "home"
          home.mkdir(mode=0o700)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"root={root}\n")

          # Fresh test-only identity; no Render, PC24x7 or repository secrets are consumed.
          key = secrets.token_hex(20)
          env = {name: os.environ[name] for name in (
              "PATH", "LANG", "LC_ALL", "SSL_CERT_FILE", "SSL_CERT_DIR", "GEM_HOME", "GEM_PATH"
          ) if name in os.environ}
          env.update({
              "GITHUB_ACTIONS": os.environ["GITHUB_ACTIONS"],
              "GITHUB_SHA": sha,
              "GITHUB_REPOSITORY": os.environ["GITHUB_REPOSITORY"],
              "GITHUB_REF": os.environ["GITHUB_REF"],
              "GITHUB_WORKSPACE": os.environ["GITHUB_WORKSPACE"],
              "RUNNER_ENVIRONMENT": os.environ["RUNNER_ENVIRONMENT"],
              "HOME": str(home),
              "BUNDLE_PATH": str(root / "gems"),
              "REQSYS_REDMINE_EPHEMERAL_E2E": "1",
              "REQSYS_REDMINE_API_KEY": key,
          })
          source_gate = runpy.run_path(str(Path("render_runtime/release_identity.py").resolve()))
          capture_source = source_gate["capture_source_identity"]
          SourceIdentityError = source_gate["IdentityError"]
          source_identity = capture_source(root, env)
          copied_build = root / "render_runtime/build_redmine_6_1_4.sh"
          original_build = copied_build.read_bytes()
          wrong_source_sha = ("0" if sha[0] != "0" else "1") + sha[1:]
          for name in ("wrong_sha", "changed_source"):
              try:
                  candidate_env = dict(env)
                  if name == "wrong_sha":
                      candidate_env["GITHUB_SHA"] = wrong_source_sha
                  else:
                      copied_build.write_bytes(original_build + b"\n# controlled source tamper\n")
                  try:
                      capture_source(root, candidate_env)
                  except SourceIdentityError:
                      pass
                  else:
                      raise SystemExit("CI_SOURCE_NEGATIVE_CONTROL_MISSED")
              finally:
                  copied_build.write_bytes(original_build)
              if capture_source(root, env) != source_identity or (root / ".runtime").exists():
                  raise SystemExit("CI_SOURCE_RESTORED_REPLAY_FAILED")
          print(f"SOURCE_SNAPSHOT_VERIFIED sha={sha} controls=2 replay=passed", flush=True)
          log = root / "build.log"
          print(f"REDMINE_ISOLATED_BUILD_STARTED sha={sha}", flush=True)
          with log.open("x", encoding="utf-8") as stream:
              proc = subprocess.Popen(
                  ["bash", "render_runtime/build_redmine_6_1_4.sh"],
                  cwd=root, env=env, stdout=stream, stderr=subprocess.STDOUT,
                  start_new_session=True,
              )
              try:
                  code = proc.wait(timeout=300)
              except subprocess.TimeoutExpired:
                  os.killpg(proc.pid, signal.SIGTERM)
                  try:
                      proc.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      os.killpg(proc.pid, signal.SIGKILL)
                      proc.wait()
                  code = 124
          text = log.read_text(encoding="utf-8", errors="replace").replace(key, "[REDACTED]")
          print("\n".join(text.splitlines()[-160:]), flush=True)
          if code:
              print(f"REDMINE_ISOLATED_BUILD_FAILED sha={sha} exit={code}", flush=True)
              raise SystemExit(code)

          runtime = root / ".runtime/redmine-6.1.5"
          complete_gate = runpy.run_path(str(Path("render_runtime/completion_gate.py").resolve()))
          upstream_suites = complete_gate["require_complete_suites"]({
              name: (runtime / f"tmp/reqsys-{name}-compat.log").read_text(encoding="utf-8")
              for name in ("attachment", "mailer")
          })
          evidence = runtime / "public/reqsys-e2e/evidence.json"
          raw = evidence.read_text(encoding="utf-8")
          if key in raw:
              raise SystemExit("CI_EVIDENCE_SECRET_DETECTED")
          proof = json.loads(raw)
          if proof.get("status") != "passed":
              raise SystemExit("CI_BUILD_EVIDENCE_NOT_PASSED")
          identity_gate = runpy.run_path(str(Path("render_runtime/release_identity.py").resolve()))
          verify_manifest = identity_gate["verify_manifest"]
          IdentityError = identity_gate["IdentityError"]
          manifest = verify_manifest(runtime, sha)
          if manifest["source_identity"] != source_identity:
              raise SystemExit("CI_SOURCE_IDENTITY_CHANGED")
          if proof.get("redmine_repo_sha") != sha or proof.get("source_identity") != manifest["source_identity"]:
              raise SystemExit("CI_RELEASE_SOURCE_MISMATCH")

          # Exercise the installed manifest against independently altered copies.
          # Never mutate the validated runtime, its database, or service files.
          with tempfile.TemporaryDirectory(prefix="release-controls-", dir=root) as control_dir:
              control_root = Path(control_dir)
              for relative in (*identity_gate["ARTIFACTS"], identity_gate["MANIFEST_PATH"]):
                  target = control_root / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(runtime / relative, target)
              manifest_path = control_root / identity_gate["MANIFEST_PATH"]
              original_manifest = manifest_path.read_bytes()
              wrong_sha = ("0" if sha[0] != "0" else "1") + sha[1:]
              cases = (
                  ("expected_sha", None),
                  ("manifest_sha", manifest_path),
                  ("artifact_bytes", control_root / "Gemfile.lock"),
                  ("evidence_bytes", control_root / "public/reqsys-e2e/evidence.json"),
              )
              for name, target in cases:
                  before = target.read_bytes() if target else None
                  try:
                      if name == "manifest_sha":
                          corrupted = json.loads(before)
                          corrupted["source_identity"]["source_sha"] = wrong_sha
                          target.write_text(json.dumps(corrupted), encoding="utf-8")
                      elif target:
                          target.write_bytes(before + b"\nCONTROL_TAMPER\n")
                      try:
                          verify_manifest(control_root, wrong_sha if name == "expected_sha" else sha)
                      except IdentityError:
                          pass
                      else:
                          raise SystemExit("CI_RELEASE_NEGATIVE_CONTROL_MISSED")
                  finally:
                      if target:
                          target.write_bytes(before)
                  if verify_manifest(control_root, sha) != manifest:
                      raise SystemExit("CI_RELEASE_RESTORED_REPLAY_FAILED")
              if manifest_path.read_bytes() != original_manifest:
                  raise SystemExit("CI_RELEASE_MANIFEST_NOT_RESTORED")
          if verify_manifest(runtime, sha) != manifest:
              raise SystemExit("CI_RELEASE_FINAL_READBACK_FAILED")
          print(f"RELEASE_MANIFEST_VERIFIED sha={sha} controls=4 replay=passed scope=isolated-build", flush=True)
          issue_id = proof["positive"]["redmine_issue_id"]
          project_id = proof["redmine"]["project_id"]
          db_path = root / ".runtime/redmine-6.1.5/tmp/reqsys_redmine_e2e.sqlite3"
          db = sqlite3.connect(db_path.as_uri() + "?mode=ro", uri=True)
          try:
              if db.execute("PRAGMA integrity_check").fetchone() != ("ok",):
                  raise SystemExit("CI_SQLITE_INTEGRITY_FAILED")
              if db.execute("SELECT project_id FROM issues WHERE id=?", (issue_id,)).fetchone() != (project_id,):
                  raise SystemExit("CI_PERSISTED_ISSUE_MISMATCH")
              if db.execute("SELECT is_public FROM projects WHERE id=?", (project_id,)).fetchone() != (0,):
                  raise SystemExit("CI_PROJECT_NOT_PRIVATE")
          finally:
              db.close()
          print(json.dumps({
              "status": "passed", "redmine_repo_sha": sha,
              "reqsys_sha": proof["reqsys_sha"], "correlation_id": proof["correlation_id"],
              "redmine_version": proof["redmine"]["version"],
              "issue_id": issue_id, "project_id": project_id,
              "independent_sqlite_readback": True,
              "upstream_suites": upstream_suites,
              "evidence_sha256": hashlib.sha256(raw.encode()).hexdigest(),
              "release_manifest_sha256": hashlib.sha256((runtime / identity_gate["MANIFEST_PATH"]).read_bytes()).hexdigest(),
              "source_runtime_sha256": manifest["source_identity"]["source_runtime_sha256"],
              "release_manifest_controls": 4,
              "source_snapshot_controls": 2,
              "scope": "github_hosted_isolated_not_render_or_pc24x7",
          }, sort_keys=True), flush=True)

      - name: Audit the downloaded runtime lock without bypass
        if: always() && steps.build.outputs.root != ''
        shell: bash
        env:
          BUILD_ROOT: ${{ steps.build.outputs.root }}
        run: |
          set -euo pipefail
          target="${BUILD_ROOT}/.runtime/redmine-6.1.5"
          if [ ! -s "${target}/Gemfile.lock" ]; then
            echo "RUNTIME_AUDIT_BLOCKED_LOCK_NOT_GENERATED" >&2
            exit 2
          fi
          timeout --kill-after=10s 120s gem install --no-document bundler-audit --version 0.9.2
          cd "${target}"
          sha256sum Gemfile.lock
          timeout --kill-after=10s 120s bundler-audit check --update
